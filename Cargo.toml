[package]
edition = "2024"
name = "psf2vga"
version = "0.1.0"

[dependencies]
clap = { default-features = false, features = [
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "usage",
  "wrap_help",
], version = "4.5.53" }
color-eyre = "0.6.5"
flate2 = "1.1.7"
image = { default-features = false, features = ["png"], version = "0.25.9" }
zerocopy = { features = ["derive"], version = "0.8.31" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
strip = "symbols"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

exit = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

str_to_string = "warn"
string_slice = "warn"

allow_attributes = "deny"
default_numeric_fallback = "deny"
unused_trait_names = "warn"
