[package]
edition = "2024"
name = "psf2vga"
version = "0.1.1"

[dependencies]
clap = { default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
  "wrap_help",
], version = "4.6.0" }
color-eyre = "0.6.5"
flate2 = "1.1.9"
image = { default-features = false, features = ["webp"], version = "0.25.10" }
tap = "1.0.1"
zerocopy = { features = ["derive"], version = "0.8.48" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = "symbols"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

exit = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

str_to_string = "warn"
string_slice = "warn"

allow_attributes = "deny"
default_numeric_fallback = "deny"
unused_trait_names = "warn"
